<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - 오류</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .error-container {
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 96px;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
        }
        .error-message {
            font-size: 20px;
            margin: 16px 0 32px;
            color: #666;
        }
        .back-link {
            display: inline-block;
            padding: 12px 32px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-link:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <p class="error-message">{{ message }}</p>
        <a href="/" class="back-link">홈으로 돌아가기</a>
    </div>
</body>
</html>
