{% extends "stock/stock_layout.html" %}
{% block title %}가상매매{% endblock %}
{% block page_name %}가상매매 트래킹{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.panel {
    background: var(--bg-2); border: 1px solid var(--line-1);
    border-radius: var(--r-3); padding: 20px 22px; margin-bottom: 14px;
}
.panel-title {
    font-size: 0.72rem; font-weight: 700; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: var(--font-mono); margin-bottom: 16px;
}
.stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    margin-bottom: 14px;
}
.stat-card {
    background: var(--bg-3); border-radius: var(--r-2); padding: 12px 14px; text-align: center;
}
.stat-label { font-size: 0.65rem; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
.stat-val   { font-size: 1.3rem; font-weight: 700; color: var(--fg-1); margin-top: 4px; font-family: var(--font-mono); }
.stat-val.green { color: #4ade80; }
.stat-val.red   { color: #f87171; }
.stat-val.amber { color: #fbbf24; }

.cat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
    margin-bottom: 14px;
}
.cat-card {
    background: var(--bg-3); border-radius: var(--r-2); padding: 12px 14px;
}
.cat-name  { font-size: 0.75rem; font-weight: 700; color: var(--fg-2); margin-bottom: 8px; }
.cat-row   { display: flex; justify-content: space-between; font-size: 0.72rem; margin-bottom: 4px; }
.cat-key   { color: var(--fg-3); }
.cat-num   { font-family: var(--font-mono); color: var(--fg-1); }

.filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn {
    padding: 5px 14px; border-radius: 20px; border: 1px solid var(--line-1);
    background: var(--bg-3); color: var(--fg-2); cursor: pointer; font-size: 0.75rem;
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
thead th {
    text-align: left; padding: 7px 10px;
    font-size: 0.65rem; font-weight: 700; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--line-1);
}
tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line-1); color: var(--fg-2); }
tbody tr:last-child td { border-bottom: none; }

.badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 0.65rem; font-weight: 700; letter-spacing: .04em;
}
.badge-open    { background: rgba(96,165,250,.15); color: #60a5fa; }
.badge-hit     { background: rgba(74,222,128,.15); color: #4ade80; }
.badge-stop    { background: rgba(248,113,113,.15); color: #f87171; }
.badge-timeout { background: rgba(251,191,36,.15);  color: #fbbf24; }

.ret-pos { color: #4ade80; font-family: var(--font-mono); }
.ret-neg { color: #f87171; font-family: var(--font-mono); }
.ret-nil { color: var(--fg-3); font-family: var(--font-mono); }

.run-btn {
    padding: 8px 22px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--r-2); cursor: pointer;
    font-size: 0.8rem; font-weight: 600;
}
.run-btn:disabled { opacity: .5; cursor: not-allowed; }

#chartWrap { position: relative; height: 220px; }
</style>

<!-- 상단 요약 -->
<div class="panel">
  <div class="panel-title">요약</div>
  <div class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="stat-label">총 거래</div><div class="stat-val" id="sTotalTrades">—</div></div>
    <div class="stat-card"><div class="stat-label">종료</div><div class="stat-val" id="sClosed">—</div></div>
    <div class="stat-card"><div class="stat-label">진행중</div><div class="stat-val amber" id="sOpen">—</div></div>
    <div class="stat-card"><div class="stat-label">승률</div><div class="stat-val" id="sWinRate">—</div></div>
    <div class="stat-card"><div class="stat-label">평균 수익률(총)</div><div class="stat-val" id="sAvgReturn">—</div></div>
    <div class="stat-card"><div class="stat-label">평균 수익률(순)</div><div class="stat-val" id="sAvgNetReturn">—</div></div>
  </div>

  <div class="cat-grid" id="catGrid"></div>

  <button class="run-btn" id="runBtn" onclick="runPaper()">지금 실행 (신규 등록 + 상태 체크)</button>
  <span id="runMsg" style="margin-left:12px; font-size:0.75rem; color:var(--fg-3);"></span>
</div>

<!-- 누적 손익 추이 -->
<div class="panel">
  <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;">
    <span>누적 순손익 추이 <small style="font-weight:400;text-transform:none;letter-spacing:0;">(수수료+슬리피지 차감)</small></span>
    <span id="pnlTip" style="font-size:0.72rem;color:var(--fg-3);"></span>
  </div>
  <div style="position:relative;height:200px;"><canvas id="pnlChart"></canvas></div>
</div>

<!-- 수익률 분포 차트 -->
<div class="panel">
  <div class="panel-title">종료 거래 수익률 분포</div>
  <div id="chartWrap"><canvas id="retChart"></canvas></div>
</div>

<!-- 거래 목록 -->
<div class="panel">
  <div class="panel-title">거래 목록</div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter(this, '')">전체</button>
    <button class="filter-btn" onclick="setFilter(this, 'OPEN')">진행중</button>
    <button class="filter-btn" onclick="setFilter(this, 'HIT')">목표달성</button>
    <button class="filter-btn" onclick="setFilter(this, 'STOP')">손절</button>
    <button class="filter-btn" onclick="setFilter(this, 'TIMEOUT')">기간만료</button>
  </div>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>종목</th><th>카테고리</th><th>진입일</th><th>진입가</th>
          <th>목표</th><th>손절</th><th>상태</th><th>청산일</th><th>청산가</th><th>수익률</th>
        </tr>
      </thead>
      <tbody id="tradeBody"></tbody>
    </table>
  </div>
</div>

<script>
let retChart = null;
let pnlChart = null;
let currentFilter = '';

const CAT_LABELS = {triple:'강력추천', daily:'데일리', short:'단타', swing:'스윙'};

async function loadSummary() {
  const r = await fetch('/api/paper_trading/summary');
  const d = await r.json();

  const wr = d.win_rate ?? 0;
  const ar = d.avg_return ?? 0;

  document.getElementById('sTotalTrades').textContent = d.total_trades ?? '—';
  document.getElementById('sClosed').textContent = d.n_closed ?? '—';
  document.getElementById('sOpen').textContent = d.n_open ?? '—';
  document.getElementById('sWinRate').textContent = d.n_closed ? wr.toFixed(1) + '%' : '—';

  const arEl = document.getElementById('sAvgReturn');
  arEl.textContent = d.n_closed ? (ar >= 0 ? '+' : '') + ar.toFixed(2) + '%' : '—';
  arEl.className = 'stat-val ' + (ar > 0 ? 'green' : ar < 0 ? 'red' : '');

  const anr = d.avg_net_return ?? ar;
  const anrEl = document.getElementById('sAvgNetReturn');
  anrEl.textContent = d.n_closed ? (anr >= 0 ? '+' : '') + anr.toFixed(2) + '%' : '—';
  anrEl.className = 'stat-val ' + (anr > 0 ? 'green' : anr < 0 ? 'red' : '');

  // 카테고리별 카드
  const catGrid = document.getElementById('catGrid');
  catGrid.innerHTML = '';
  for (const [cat, info] of Object.entries(d.by_category ?? {})) {
    const ar2 = info.avg_return ?? 0;
    const sign = ar2 >= 0 ? '+' : '';
    catGrid.innerHTML += `
      <div class="cat-card">
        <div class="cat-name">${CAT_LABELS[cat] ?? cat}</div>
        <div class="cat-row"><span class="cat-key">거래수</span><span class="cat-num">${info.n}</span></div>
        <div class="cat-row"><span class="cat-key">승률</span><span class="cat-num">${info.win_rate}%</span></div>
        <div class="cat-row"><span class="cat-key">평균수익</span>
          <span class="cat-num" style="color:${ar2>=0?'#4ade80':'#f87171'}">${sign}${ar2.toFixed(2)}%</span>
        </div>
      </div>`;
  }
}

async function loadTrades(status) {
  const url = '/api/paper_trading/trades' + (status ? '?status=' + status : '');
  const r = await fetch(url);
  const trades = await r.json();
  renderTable(trades);
  if (!status) renderChart(trades);
}

function renderTable(trades) {
  const body = document.getElementById('tradeBody');
  if (!trades.length) { body.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--fg-3);padding:20px;">데이터 없음</td></tr>'; return; }
  body.innerHTML = trades.map(t => {
    const net = t.net_return_pct ?? t.return_pct;
    const retHtml = net == null
      ? '<span class="ret-nil">—</span>'
      : `<span class="${net >= 0 ? 'ret-pos' : 'ret-neg'}" title="총수익률: ${t.return_pct != null ? (t.return_pct >= 0 ? '+' : '') + t.return_pct.toFixed(2) + '%' : '—'}">${net >= 0 ? '+' : ''}${net.toFixed(2)}%<small style="color:var(--fg-3);font-size:0.6em;margin-left:3px;">(순)</small></span>`;
    const badgeClass = {OPEN:'badge-open', HIT:'badge-hit', STOP:'badge-stop', TIMEOUT:'badge-timeout'}[t.status] || '';
    return `<tr>
      <td>${t.name}<br><small style="color:var(--fg-3)">${t.code}</small></td>
      <td>${CAT_LABELS[t.category] ?? t.category}</td>
      <td style="font-family:var(--font-mono)">${fmtDate(t.entry_date)}</td>
      <td style="font-family:var(--font-mono)">${(t.entry_price||0).toLocaleString()}</td>
      <td style="font-family:var(--font-mono)">${(t.target||0).toLocaleString()}</td>
      <td style="font-family:var(--font-mono)">${(t.stop||0).toLocaleString()}</td>
      <td><span class="badge ${badgeClass}">${t.status}</span></td>
      <td style="font-family:var(--font-mono)">${fmtDate(t.exit_date)}</td>
      <td style="font-family:var(--font-mono)">${t.exit_price ? t.exit_price.toLocaleString() : '—'}</td>
      <td>${retHtml}</td>
    </tr>`;
  }).join('');
}

function renderChart(trades) {
  const closed = trades.filter(t => t.return_pct != null);
  if (!closed.length) return;

  const rets = closed.map(t => t.return_pct);
  const min = Math.floor(Math.min(...rets) / 2) * 2 - 2;
  const max = Math.ceil(Math.max(...rets) / 2) * 2 + 2;
  const bins = [];
  const labels = [];
  const counts = [];
  const colors = [];

  for (let b = min; b < max; b += 2) {
    const label = `${b >= 0 ? '+' : ''}${b}~${b+2}%`;
    const cnt = rets.filter(r => r >= b && r < b + 2).length;
    labels.push(label);
    counts.push(cnt);
    colors.push(b >= 0 ? 'rgba(74,222,128,.7)' : 'rgba(248,113,113,.7)');
  }

  if (retChart) retChart.destroy();
  const ctx = document.getElementById('retChart').getContext('2d');
  retChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderRadius: 3 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: 'var(--fg-3)', font: { size: 10 } }, grid: { color: 'var(--line-1)' } },
        y: { ticks: { color: 'var(--fg-3)', stepSize: 1 }, grid: { color: 'var(--line-1)' } }
      }
    }
  });
}

function setFilter(el, status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadTrades(status);
}

async function runPaper() {
  const btn = document.getElementById('runBtn');
  const msg = document.getElementById('runMsg');
  btn.disabled = true;
  msg.textContent = '실행 중…';
  try {
    const r = await fetch('/api/paper_trading/run', { method: 'POST' });
    const d = await r.json();
    msg.textContent = `완료 — 신규 ${d.opened}개 | HIT ${d.check.hit} STOP ${d.check.stop} TIMEOUT ${d.check.timeout}`;
    await loadSummary();
    await loadTrades(currentFilter);
  } catch(e) {
    msg.textContent = '오류: ' + e;
  } finally {
    btn.disabled = false;
  }
}

function fmtDate(s) {
  if (!s) return '—';
  if (s.length === 8) return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
  return s;
}

async function loadPnlHistory() {
  try {
    const r = await fetch('/api/paper_trading/pnl_history');
    const pts = await r.json();
    if (!pts.length) return;

    const last = pts[pts.length - 1];
    const tip  = document.getElementById('pnlTip');
    if (tip) tip.textContent = `최종 누적: ${last.cumulative >= 0 ? '+' : ''}${last.cumulative.toFixed(2)}% (${pts.length}건)`;

    if (pnlChart) pnlChart.destroy();
    const ctx = document.getElementById('pnlChart').getContext('2d');
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6aa800';
    pnlChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: pts.map(p => fmtDate(p.date)),
        datasets: [{
          label: '누적 순손익(%)',
          data: pts.map(p => p.cumulative),
          borderColor: accentColor,
          backgroundColor: 'rgba(var(--accent-rgb, 106,168,0), 0.08)',
          pointRadius: 3,
          pointBackgroundColor: pts.map(p => p.net_return >= 0 ? '#4ade80' : '#f87171'),
          fill: true, tension: 0.3,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            label: c => {
              const p = pts[c.dataIndex];
              return [`누적: ${c.parsed.y >= 0 ? '+' : ''}${c.parsed.y.toFixed(2)}%`,
                      `  ${p.name} (${p.status}) ${p.net_return >= 0 ? '+' : ''}${p.net_return.toFixed(2)}%`];
            }
          }}
        },
        scales: {
          x: { ticks: { color: 'var(--fg-3)', font: { size: 10 }, maxRotation: 45 }, grid: { color: 'var(--line-1)' } },
          y: { ticks: { color: 'var(--fg-3)', callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%' },
               grid: { color: 'var(--line-1)' } }
        }
      }
    });
  } catch(e) {}
}

loadSummary();
loadTrades('');
loadPnlHistory();
</script>
{% endblock %}
