{% extends "stock/stock_layout.html" %}
{% block title %}주식 홈{% endblock %}
{% block page_name %}주식 홈{% endblock %}

{% block content %}
<style>
.dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
}
.panel {
    background: var(--bg-2);
    border: 1px solid var(--line-1);
    border-radius: var(--r-3);
    padding: 18px 20px;
}
.panel-title {
    font-size: 0.68rem; font-weight: 700; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: var(--font-mono); margin-bottom: 14px;
    display: flex; align-items: center; gap: 7px;
}
.stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--line-1);
    font-size: 0.82rem;
}
.stat-row:last-child { border-bottom: none; }
.stat-key { color: var(--fg-3); }
.stat-num { font-family: var(--font-mono); font-weight: 600; color: var(--fg-1); }
.stat-num.green  { color: #4ade80; }
.stat-num.red    { color: #f87171; }
.stat-num.amber  { color: #fbbf24; }
.stat-num.accent { color: var(--accent); }

.big-stat {
    font-size: 2rem; font-weight: 700;
    font-family: var(--font-mono); color: var(--fg-1);
    margin: 4px 0 2px;
}
.big-label { font-size: 0.68rem; color: var(--fg-3); font-family: var(--font-mono); }

.model-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    margin-right: 5px; flex-shrink: 0;
}
.model-dot.ok   { background: #4ade80; }
.model-dot.miss { background: #f87171; }

.link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
}
.link-card {
    background: var(--bg-3);
    border: 1px solid var(--line-1);
    border-radius: var(--r-2);
    padding: 12px 14px;
    text-decoration: none;
    color: var(--fg-2);
    font-size: 0.8rem; font-weight: 500;
    display: flex; align-items: center; gap: 9px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.link-card:hover {
    background: var(--lime-soft);
    color: var(--accent);
    border-color: var(--lime-border);
}
.link-card i { font-size: 1rem; flex-shrink: 0; }

.pipeline-badge {
    display: inline-block; padding: 2px 8px;
    border-radius: 4px; font-size: 0.68rem; font-weight: 600;
    font-family: var(--font-mono);
}
.pipeline-badge.ok   { background: rgba(74,222,128,.15); color: #4ade80; }
.pipeline-badge.warn { background: rgba(251,191,36,.15);  color: #fbbf24; }
.pipeline-badge.none { background: var(--bg-3); color: var(--fg-3); }
</style>

<div id="dashContent">
  <div style="text-align:center;padding:60px 0;color:var(--fg-3);font-size:0.82rem;">
    <div style="width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--accent);
         border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;"></div>
    로딩 중...
  </div>
</div>

<script>
async function loadDashboard() {
  try {
    const res  = await fetch('/api/stock_dashboard');
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('dashContent').innerHTML =
      '<div style="color:#f87171;padding:20px;">데이터 로드 실패: ' + e.message + '</div>';
  }
}

function pct(v, pos='green', neg='red') {
  if (v == null) return '<span class="stat-num">—</span>';
  const cls = v > 0 ? pos : v < 0 ? neg : '';
  return `<span class="stat-num ${cls}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
}

function render(data) {
  const p = data.paper    || {};
  const r = data.recommend || {};
  const m = data.model    || {};

  const wr  = p.win_rate   ?? null;
  const ar  = p.avg_return ?? null;
  const wrCls = wr == null ? '' : wr >= 50 ? 'green' : 'red';
  const arCls = ar == null ? '' : ar >= 0  ? 'green' : 'red';

  const genAt = r.generated_at ? new Date(r.generated_at).toLocaleString('ko-KR') : '—';
  const modelLabels = { daily: '데일리', short: '단타', swing: '스윙' };

  document.getElementById('dashContent').innerHTML = `
    <!-- 상단 통계 -->
    <div class="dash-grid">

      <!-- 가상매매 성과 -->
      <div class="panel">
        <div class="panel-title"><i class="bi bi-bullseye"></i>가상매매 성과</div>
        <div class="stat-row">
          <span class="stat-key">총 거래</span>
          <span class="stat-num">${p.total_trades ?? '—'}건</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">종료 / 진행중</span>
          <span class="stat-num">${p.n_closed ?? '—'} / <span class="amber">${p.n_open ?? '—'}</span></span>
        </div>
        <div class="stat-row">
          <span class="stat-key">승률</span>
          <span class="stat-num ${wrCls}">${wr != null ? wr.toFixed(1) + '%' : '—'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">평균 수익률</span>
          ${ar != null ? pct(ar) : '<span class="stat-num">—</span>'}
        </div>
        <div style="margin-top:12px;">
          ${renderCatRows(p.by_category)}
        </div>
      </div>

      <!-- 오늘의 추천 -->
      <div class="panel">
        <div class="panel-title"><i class="bi bi-stars"></i>오늘의 추천</div>
        <div class="stat-row">
          <span class="stat-key">생성 시각</span>
          <span class="stat-num" style="font-size:0.75rem;">${genAt}</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">기준일</span>
          <span class="stat-num">${r.base_date ?? '—'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">총 추천</span>
          <span class="stat-num accent">${r.n_buy ?? '—'}종목</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">강력추천</span>
          <span class="stat-num">${r.n_triple ?? '—'}개</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">데일리 / 단타 / 스윙</span>
          <span class="stat-num">${r.n_daily ?? '—'} / ${r.n_short ?? '—'} / ${r.n_swing ?? '—'}</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">모델 사용</span>
          <span class="pipeline-badge ${r.model_used ? 'ok' : 'warn'}">${r.model_used ? 'ML 모델' : '팩터 폴백'}</span>
        </div>
      </div>

      <!-- 모델 파일 상태 -->
      <div class="panel">
        <div class="panel-title"><i class="bi bi-cpu"></i>모델 상태</div>
        ${Object.entries(m).map(([label, exists]) => `
          <div class="stat-row">
            <span class="stat-key">
              <span class="model-dot ${exists ? 'ok' : 'miss'}"></span>
              ${modelLabels[label] ?? label} (XGBoost)
            </span>
            <span class="pipeline-badge ${exists ? 'ok' : 'none'}">${exists ? '로드됨' : '없음'}</span>
          </div>
        `).join('')}
        <div style="margin-top:14px;font-size:0.72rem;color:var(--fg-3);font-family:var(--font-mono);">
          모델 없으면 팩터 점수 기반 추천<br>
          재학습: run_monthly.bat (매월 1일 06:00 자동)
        </div>
      </div>

    </div>

    <!-- 빠른 이동 -->
    <div class="panel">
      <div class="panel-title"><i class="bi bi-grid"></i>빠른 이동</div>
      <div class="link-grid">
        <a href="/recommend"               class="link-card"><i class="bi bi-stars"></i>종목 추천</a>
        <a href="/paper_trading"           class="link-card"><i class="bi bi-bullseye"></i>가상매매</a>
        <a href="/stock_ai_performance"    class="link-card"><i class="bi bi-graph-up"></i>AI 성과 검증</a>
        <a href="/backtest"                class="link-card"><i class="bi bi-clock-history"></i>백테스트</a>
        <a href="/quant"                   class="link-card"><i class="bi bi-bar-chart-steps"></i>퀀트 트레이딩</a>
        <a href="/portfolio_opt"           class="link-card"><i class="bi bi-pie-chart"></i>포트폴리오 최적화</a>
        <a href="/stock_filter"            class="link-card"><i class="bi bi-funnel"></i>종목 필터</a>
        <a href="/stock_recommend_history" class="link-card"><i class="bi bi-collection"></i>추천 기록</a>
        <a href="/train_report"            class="link-card"><i class="bi bi-file-bar-graph"></i>학습 리포트</a>
        <a href="/stock_portfolio_kr"      class="link-card"><i class="bi bi-briefcase"></i>포트폴리오</a>
      </div>
    </div>
  `;
}

function renderCatRows(byCategory) {
  if (!byCategory || !Object.keys(byCategory).length) return '';
  const labels = { triple:'강력추천', daily:'데일리', short:'단타', swing:'스윙' };
  return Object.entries(byCategory).map(([cat, info]) => {
    const ar = info.avg_return ?? 0;
    return `<div class="stat-row" style="font-size:0.76rem;">
      <span class="stat-key">${labels[cat] ?? cat}</span>
      <span>
        <span class="stat-num" style="font-size:0.76rem;">${info.n}건</span>
        <span style="color:var(--fg-3);margin:0 4px;">·</span>
        <span class="stat-num ${info.win_rate >= 50 ? 'green' : 'red'}" style="font-size:0.76rem;">${info.win_rate}%</span>
        <span style="color:var(--fg-3);margin:0 4px;">·</span>
        <span class="stat-num ${ar >= 0 ? 'green' : 'red'}" style="font-size:0.76rem;">${ar >= 0 ? '+' : ''}${ar.toFixed(2)}%</span>
      </span>
    </div>`;
  }).join('');
}

loadDashboard();
</script>
{% endblock %}
