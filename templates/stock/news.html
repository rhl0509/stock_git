{% extends "stock/stock_layout.html" %}
{% block title %}뉴스 검색 — GAGYE{% endblock %}
{% block page_name %}뉴스 검색{% endblock %}

{% block content %}
<div class="pt-2 pb-5">

    <!-- 검색 바 -->
    <div class="card mb-4" style="border-color:var(--lime-border)!important;">
        <div class="card-body p-3">
            <div class="input-group">
                <span class="input-group-text" style="border-right:0;">
                    <i class="bi bi-newspaper" style="color:var(--accent);"></i>
                </span>
                <input type="text" id="searchInput" class="form-control"
                    placeholder="키워드를 입력하세요 (예: 삼성전자, 금리, 인플레이션)"
                    style="border-left:0; border-right:0;"
                    onkeydown="if(event.key==='Enter') doSearch()">
                <button class="btn btn-primary px-4" onclick="doSearch()" id="searchBtn">
                    <i class="bi bi-search me-1"></i>검색
                </button>
            </div>
        </div>
    </div>

    <!-- 상태 / 결과 헤더 -->
    <div id="statusBar" class="mb-3" style="display:none;">
        <div class="d-flex align-items-center justify-content-between">
            <span id="resultCount" style="font-size:0.82rem; color:var(--fg-2); font-family:var(--font-mono);"></span>
        </div>
    </div>

    <!-- 로딩 -->
    <div id="loadingArea" style="display:none; text-align:center; padding:60px 0;">
        <div class="spinner-border" style="color:var(--accent); width:1.8rem; height:1.8rem; border-width:2px;"></div>
        <div style="margin-top:12px; font-size:0.82rem; color:var(--fg-3);">뉴스를 불러오는 중...</div>
    </div>

    <!-- 에러 -->
    <div id="errorArea" style="display:none;">
        <div class="card" style="border-color:rgba(248,113,113,0.3)!important;">
            <div class="card-body text-center py-4">
                <i class="bi bi-exclamation-circle" style="font-size:1.8rem; color:#f87171;"></i>
                <div id="errorMsg" style="margin-top:10px; font-size:0.85rem; color:#f87171;"></div>
            </div>
        </div>
    </div>

    <!-- 결과 없음 -->
    <div id="emptyArea" style="display:none;">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-newspaper" style="font-size:2rem; color:var(--fg-3);"></i>
                <div style="margin-top:12px; font-size:0.85rem; color:var(--fg-2);">검색 결과가 없습니다.</div>
            </div>
        </div>
    </div>

    <!-- 뉴스 카드 목록 -->
    <div id="newsList"></div>

    <!-- 초기 안내 -->
    <div id="guideArea">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-search" style="font-size:2.2rem; color:var(--fg-3);"></i>
                <div style="margin-top:14px; font-size:0.92rem; color:var(--fg-1); font-weight:600;">키워드로 뉴스를 검색하세요</div>
                <div style="margin-top:6px; font-size:0.8rem; color:var(--fg-2);">Google 뉴스에서 최신 기사를 실시간으로 가져옵니다.</div>
                <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                    <span class="news-chip" onclick="quickSearch('삼성전자')">삼성전자</span>
                    <span class="news-chip" onclick="quickSearch('코스피')">코스피</span>
                    <span class="news-chip" onclick="quickSearch('금리')">금리</span>
                    <span class="news-chip" onclick="quickSearch('환율')">환율</span>
                    <span class="news-chip" onclick="quickSearch('인플레이션')">인플레이션</span>
                    <span class="news-chip" onclick="quickSearch('부동산')">부동산</span>
                </div>
            </div>
        </div>
    </div>

</div>

<style>
.news-card {
    background: var(--bg-2);
    border: 1px solid var(--line-1);
    border-radius: var(--r-3);
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
}
.news-card:hover {
    border-color: var(--lime-border);
    background: var(--bg-3);
    color: inherit;
    text-decoration: none;
}
.news-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--fg-1);
    line-height: 1.45;
    margin-bottom: 8px;
}
.news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.news-source {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    font-family: var(--font-mono);
    background: var(--lime-soft);
    border: 1px solid var(--lime-border);
    padding: 2px 8px;
    border-radius: 4px;
}
.news-date {
    font-size: 0.74rem;
    color: var(--fg-3);
    font-family: var(--font-mono);
}
.news-link-icon {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--fg-3);
}
.news-chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--line-2);
    background: var(--bg-3);
    color: var(--fg-2);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
}
.news-chip:hover {
    border-color: var(--lime-border);
    color: var(--accent);
    background: var(--lime-soft);
}
</style>

<script>
function show(id) { document.getElementById(id).style.display = ''; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function clearResults() {
    hide('loadingArea'); hide('errorArea'); hide('emptyArea');
    hide('guideArea'); hide('statusBar');
    document.getElementById('newsList').innerHTML = '';
}

function quickSearch(kw) {
    document.getElementById('searchInput').value = kw;
    doSearch();
}

async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    clearResults();
    show('loadingArea');
    document.getElementById('searchBtn').disabled = true;

    try {
        const res = await fetch(`/api/news/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        hide('loadingArea');
        document.getElementById('searchBtn').disabled = false;

        if (!res.ok) {
            document.getElementById('errorMsg').textContent = data.error || '오류가 발생했습니다.';
            show('errorArea'); return;
        }

        if (!data.items || data.items.length === 0) { show('emptyArea'); return; }

        document.getElementById('resultCount').textContent = `"${q}" 검색 결과 ${data.total}건`;
        show('statusBar');

        const list = document.getElementById('newsList');
        data.items.forEach(item => {
            const date = item.pubDate ? formatDate(item.pubDate) : '';
            list.innerHTML += `
                <a href="${escHtml(item.link)}" target="_blank" rel="noopener" class="news-card">
                    <div class="news-title">${escHtml(item.title)}</div>
                    <div class="news-meta">
                        ${item.source ? `<span class="news-source">${escHtml(item.source)}</span>` : ''}
                        ${date ? `<span class="news-date">${date}</span>` : ''}
                        <span class="news-link-icon"><i class="bi bi-box-arrow-up-right"></i></span>
                    </div>
                </a>`;
        });
    } catch (e) {
        hide('loadingArea');
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('errorMsg').textContent = '네트워크 오류가 발생했습니다.';
        show('errorArea');
    }
}

function formatDate(raw) {
    try {
        const d = new Date(raw);
        if (isNaN(d)) return raw;
        return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch { return raw; }
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}
</script>
{% endblock %}
