{% extends "stock/stock_layout.html" %}
{% block title %}포트폴리오 월별 성과 — GAGYE{% endblock %}
{% block page_name %}월별 성과{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>
<style>
    .pp-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .pp-title { font-size:1rem; font-weight:700; color:var(--fg-1); }

    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
    @media(max-width:700px) { .stat-grid { grid-template-columns:repeat(2,1fr); } }
    .stat-card { background:var(--bg-2); border:1px solid var(--line-1); border-radius:12px; padding:16px 18px; box-shadow:var(--card-shadow); }
    .stat-label { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-3); font-family:var(--font-mono); margin-bottom:8px; }
    .stat-val { font-size:1.7rem; font-weight:700; font-family:var(--font-mono); line-height:1; }
    .stat-sub { font-size:0.7rem; color:var(--fg-3); margin-top:5px; }
    .up   { color:#f87171; }
    .down { color:#6b9fc9; }
    .green{ color:#34d399; }
    .lime { color:var(--lime); }

    .chart-card { background:var(--bg-2); border:1px solid var(--line-1); border-radius:12px; padding:20px; box-shadow:var(--card-shadow); margin-bottom:16px; }
    .chart-title { font-size:0.78rem; font-weight:700; color:var(--fg-2); text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-mono); margin-bottom:16px; }

    .tbl-card { background:var(--bg-2); border:1px solid var(--line-1); border-radius:12px; overflow:hidden; box-shadow:var(--card-shadow); }
    .tbl-head-bar { padding:14px 18px; border-bottom:1px solid var(--line-1); font-size:0.82rem; font-weight:700; color:var(--fg-1); }
    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    thead { background:var(--bg-3); }
    th { padding:10px 14px; text-align:right; color:var(--fg-3); font-weight:600; font-size:0.68rem; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; font-family:var(--font-mono); }
    th:first-child, td:first-child { text-align:left; }
    td { padding:10px 14px; text-align:right; border-bottom:1px solid var(--line-1); color:var(--fg-1); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,0.02); }
    .pnl-pos { color:#34d399; font-weight:600; font-family:var(--font-mono); }
    .pnl-neg { color:#f87171; font-weight:600; font-family:var(--font-mono); }
    .pnl-zero{ color:var(--fg-3); font-family:var(--font-mono); }

    .spin { display:inline-block; width:18px; height:18px; border:2px solid var(--line-2); border-top-color:#0ea5e9; border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-box { text-align:center; padding:60px; color:var(--fg-3); }
</style>

<div style="padding:20px 0 60px;">

    <div class="pp-header">
        <div class="pp-title"><i class="bi bi-bar-chart-fill" style="color:#0ea5e9; margin-right:6px;"></i>포트폴리오 월별 성과</div>
    </div>

    <!-- 요약 카드 -->
    <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-label">로딩 중</div><div class="spin"></div></div>
    </div>

    <!-- 월별 손익 차트 -->
    <div class="chart-card">
        <div class="chart-title">월별 실현 손익 vs KOSPI</div>
        <div id="chartPnl"></div>
    </div>

    <!-- 테이블 -->
    <div class="tbl-card">
        <div class="tbl-head-bar">월별 상세</div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>월</th>
                        <th>실현 손익</th>
                        <th>매도 금액</th>
                        <th>매수 금액</th>
                        <th>매도 건수</th>
                        <th>KOSPI 등락</th>
                    </tr>
                </thead>
                <tbody id="tblBody">
                    <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--fg-3);"><div class="spin"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
let _chart = null;

function fmtMoney(v) {
    if (v == null) return '–';
    const abs = Math.abs(v);
    if (abs >= 100000000) return (v / 100000000).toFixed(1) + '억';
    if (abs >= 10000)     return (v / 10000).toFixed(0) + '만';
    return v.toLocaleString() + '원';
}
function pctStr(v) {
    if (v == null) return '–';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

async function load() {
    const res  = await fetch('/api/portfolio_perf');
    const data = await res.json();
    if (!data.ok) return;

    const s = data.summary;
    const pnlColor = s.total_pnl >= 0 ? '#34d399' : '#f87171';

    document.getElementById('statGrid').innerHTML = `
        <div class="stat-card">
            <div class="stat-label">총 실현 손익</div>
            <div class="stat-val" style="color:${pnlColor}; font-size:1.3rem;">${fmtMoney(s.total_pnl)}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">수익 월</div>
            <div class="stat-val lime">${s.win_months}<span style="font-size:1rem;color:var(--fg-3);">월</span></div>
            <div class="stat-sub">/ 총 ${s.total_months}개월</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">월 승률</div>
            <div class="stat-val ${s.win_rate >= 50 ? 'green' : 'down'}">${s.win_rate}<span style="font-size:1rem;">%</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">분석 기간</div>
            <div class="stat-val" style="font-size:1.3rem;color:var(--fg-1);">${s.total_months}<span style="font-size:1rem;color:var(--fg-3);">개월</span></div>
        </div>`;

    renderChart(data.monthly);
    renderTable(data.monthly);
}

function renderChart(monthly) {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const cats  = monthly.map(m => m.ym);
    const pnls  = monthly.map(m => Math.round(m.pnl / 10000));  // 만원 단위
    const kospi = monthly.map(m => m.kospi_ret != null ? m.kospi_ret : null);

    const opts = {
        series: [
            { name: '실현손익(만원)', type: 'bar',  data: pnls },
            { name: 'KOSPI(%)',       type: 'line', data: kospi },
        ],
        chart: { height: 280, type: 'line', background: 'transparent', toolbar: { show: false }, animations: { enabled: false } },
        plotOptions: { bar: { borderRadius: 4, columnWidth: '55%',
            colors: { ranges: [{ from:-999999, to:0, color:'#f87171' }, { from:0, to:999999, color:'#34d399' }] } } },
        stroke: { width: [0, 2], curve: 'smooth' },
        colors: ['#34d399', '#fbbf24'],
        xaxis: { categories: cats, labels: { style: { colors: isDark ? '#8892a4' : '#9ca3af', fontSize:'11px' } } },
        yaxis: [
            { title: { text: '만원', style: { color: isDark ? '#8892a4' : '#9ca3af' } },
              labels: { style: { colors: isDark ? '#8892a4' : '#9ca3af' } } },
            { opposite: true, title: { text: '%', style: { color: isDark ? '#8892a4' : '#9ca3af' } },
              labels: { style: { colors: isDark ? '#8892a4' : '#9ca3af' }, formatter: v => v != null ? v.toFixed(1) + '%' : '' } },
        ],
        legend: { labels: { colors: isDark ? '#c8d0e0' : '#374151' } },
        grid: { borderColor: isDark ? '#1e2740' : '#f3f4f6' },
        tooltip: { theme: isDark ? 'dark' : 'light' },
        theme: { mode: isDark ? 'dark' : 'light' },
    };

    if (_chart) _chart.destroy();
    _chart = new ApexCharts(document.getElementById('chartPnl'), opts);
    _chart.render();
}

function renderTable(monthly) {
    const rows = [...monthly].reverse();
    document.getElementById('tblBody').innerHTML = rows.map(m => {
        const cls = m.pnl > 0 ? 'pnl-pos' : m.pnl < 0 ? 'pnl-neg' : 'pnl-zero';
        const sign = m.pnl >= 0 ? '+' : '';
        const kp = m.kospi_ret != null ? pctStr(m.kospi_ret) : '–';
        const kpCls = m.kospi_ret > 0 ? 'up' : m.kospi_ret < 0 ? 'down' : '';
        return `<tr>
            <td style="font-weight:600;">${m.ym}</td>
            <td class="${cls}">${sign}${m.pnl.toLocaleString()}원</td>
            <td>${m.sell_amt.toLocaleString()}원</td>
            <td>${m.buy_amt.toLocaleString()}원</td>
            <td>${m.sell_cnt}건</td>
            <td class="${kpCls}">${kp}</td>
        </tr>`;
    }).join('');
}

window.onload = load;
</script>
{% endblock %}
