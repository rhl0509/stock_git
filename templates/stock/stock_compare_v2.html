{% extends 'stock/stock_layout.html' %}
{% block title %}종목 비교 - 가계부 Pro{% endblock %}
{% block page_name %}종목 비교{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    .cmp-card {
        background: var(--bg-2); border: 1px solid var(--line-1);
        border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
        box-shadow: var(--card-shadow);
    }
    .cmp-title {
        font-size: 0.8rem; font-weight: 700; color: var(--fg-3);
        text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px;
    }
    .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .cmp-input {
        flex: 1; padding: 10px 14px; border: 1.5px solid var(--line-2);
        border-radius: 10px; font-size: 0.9rem; color: var(--fg-1);
        background: var(--bg-3); outline: none;
    }
    .cmp-input:focus { border-color: var(--accent); }
    .cmp-input::placeholder { color: var(--fg-3); }
    .cmp-add-btn {
        padding: 10px 18px; background: var(--fg-1); color: var(--bg-1);
        border: none; border-radius: 10px; font-weight: 700;
        font-size: 0.88rem; cursor: pointer; white-space: nowrap;
        transition: opacity .15s;
    }
    .cmp-add-btn:hover { opacity: .85; }
    .cmp-run-btn {
        padding: 11px 24px; background: var(--accent); color: #fff;
        border: none; border-radius: 10px; font-weight: 700;
        font-size: 0.9rem; cursor: pointer; transition: opacity .15s;
    }
    .cmp-run-btn:hover { opacity: .85; }
    .cmp-run-btn:disabled { opacity: .4; cursor: not-allowed; }
    .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 600;
        border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg-1);
    }
    .chip-x {
        background: none; border: none; cursor: pointer;
        color: var(--fg-3); font-size: 0.85rem; padding: 0; line-height: 1;
    }
    .chip-x:hover { color: var(--fg-1); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* 자동완성 */
    .ac-wrap { position: relative; flex: 1; }
    .ac-list {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0;
        background: var(--bg-2); border: 1px solid var(--line-2);
        border-radius: 10px; box-shadow: var(--menu-shadow);
        z-index: 999; max-height: 220px; overflow-y: auto; display: none;
    }
    .ac-list.show { display: block; }
    .ac-item {
        display: flex; justify-content: space-between; padding: 10px 14px;
        cursor: pointer; border-bottom: 1px solid var(--line-1);
        font-size: 0.85rem; transition: background .1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--bg-3); }
    .ac-name { font-weight: 600; color: var(--fg-1); }
    .ac-ticker { font-size: 0.73rem; color: var(--fg-3); font-family: monospace; }

    /* 결과 */
    .chart-card {
        background: var(--bg-2); border: 1px solid var(--line-1);
        border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
        box-shadow: var(--card-shadow);
    }
    .chart-title {
        font-weight: 700; font-size: 0.88rem; color: var(--fg-1);
        margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .chart-h { height: 320px; }

    /* 지표 비교 테이블 */
    .cmp-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .cmp-table th {
        padding: 10px 16px; text-align: center; font-weight: 700;
        font-size: 0.75rem; color: var(--fg-3); background: var(--bg-3);
        border-bottom: 1px solid var(--line-1); letter-spacing: .4px;
    }
    .cmp-table th:first-child { text-align: left; }
    .cmp-table td {
        padding: 11px 16px; text-align: center; border-bottom: 1px solid var(--line-1);
        color: var(--fg-1);
    }
    .cmp-table td:first-child { text-align: left; font-weight: 600; color: var(--fg-2); font-size: 0.78rem; }
    .cmp-table tr:last-child td { border-bottom: none; }
    .cmp-table tr:hover td { background: var(--bg-3); }
    .cmp-stock-head { font-weight: 700; color: var(--fg-1); font-size: 0.82rem; }
    .cmp-stock-code { font-size: 0.7rem; color: var(--fg-3); font-family: monospace; margin-top: 2px; }
    .val-up   { color: #f43f5e; font-weight: 700; }
    .val-down { color: #3b82f6; font-weight: 700; }
    .val-green { color: #10b981; font-weight: 700; }
    .val-red   { color: #ef4444; font-weight: 700; }
    .val-gray  { color: var(--fg-3); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--fg-3); }
    .empty-state i { font-size: 2.8rem; display: block; margin-bottom: 14px; opacity: .25; }
    .skel { background: linear-gradient(90deg, var(--bg-3) 25%, var(--line-1) 50%, var(--bg-3) 75%);
            background-size: 200%; animation: shimmer 1.3s infinite; border-radius: 10px; }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* AI 분석 카드 */
    .ai-card {
        background: var(--bg-2); border: 1px solid var(--line-1);
        border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
        box-shadow: var(--card-shadow);
    }
    .ai-card-title {
        font-weight: 700; font-size: 0.88rem; color: var(--fg-1);
        margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .ai-run-btn {
        padding: 10px 22px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff; border: none; border-radius: 10px; font-weight: 700;
        font-size: 0.88rem; cursor: pointer; transition: opacity .15s;
        display: flex; align-items: center; gap: 8px;
    }
    .ai-run-btn:hover { opacity: .88; }
    .ai-run-btn:disabled { opacity: .4; cursor: not-allowed; }
    .ai-output {
        font-size: 0.88rem; line-height: 1.75; color: var(--fg-1);
        white-space: pre-wrap; margin-top: 14px;
        border-top: 1px solid var(--line-1); padding-top: 14px;
        display: none;
    }
    .ai-output.visible { display: block; }
    .ai-cursor {
        display: inline-block; width: 2px; height: 1em;
        background: var(--accent); animation: blink .7s step-end infinite;
        vertical-align: text-bottom; margin-left: 1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<div style="padding: 20px 0 60px;">

    <!-- 종목 선택 카드 -->
    <div class="cmp-card">
        <div class="cmp-title">비교할 종목 추가 <span style="font-weight:400;">(최대 5개)</span></div>
        <div class="add-row">
            <div class="ac-wrap">
                <input type="text" id="cmpInput" class="cmp-input"
                    placeholder="종목명 또는 티커 (예: 삼성전자, AAPL)"
                    oninput="onAcInput()" onkeydown="onAcKeydown(event)">
                <div class="ac-list" id="acList"></div>
            </div>
            <button class="cmp-add-btn" onclick="addByInput()">
                <i class="bi bi-plus-lg me-1"></i>추가
            </button>
        </div>
        <div class="chips-row" id="chipsRow">
            <span id="chipsEmpty" style="font-size:0.8rem;color:var(--fg-3);">추가된 종목이 없습니다.</span>
        </div>
        <button class="cmp-run-btn" id="runBtn" onclick="runCompare()" disabled>
            <i class="bi bi-bar-chart-steps me-1"></i>비교 시작
        </button>
    </div>

    <!-- 결과 영역 -->
    <div id="cmpResult">
        <div class="empty-state">
            <i class="bi bi-bar-chart-steps"></i>
            <p>종목을 2개 이상 추가하고 비교를 시작하세요</p>
        </div>
    </div>

</div>

<script>
// ── 색상 팔레트 ──
const COLORS = ['#6366f1','#f59e0b','#10b981','#f43f5e','#3b82f6'];

let stocks = [];   // [{ticker, name}]
let selTicker = null, acTimer = null, acIdx = -1;
let chartInst = null;
let lastStocksData = [];   // valid stock objects from last compare run

// ── 자동완성 ──
function onAcInput() {
    const v = document.getElementById('cmpInput').value.trim();
    selTicker = null; acIdx = -1;
    if (!v) { closeAc(); return; }
    clearTimeout(acTimer);
    acTimer = setTimeout(async () => {
        try {
            const isKo = /[가-힣]/.test(v);
            if (isKo) {
                const res  = await fetch('/search-stock-kr?q=' + encodeURIComponent(v));
                const data = await res.json();
                showAc(data.map(d => ({ name: d.name, ticker: d.ticker })), v);
            } else {
                const res  = await fetch('/search-stock?q=' + encodeURIComponent(v));
                const data = await res.json();
                showAc(data.map(d => ({ name: d.name || d.ticker, ticker: d.ticker })), v);
            }
        } catch {}
    }, 200);
}
function showAc(items, q) {
    const l = document.getElementById('acList');
    if (!items.length) {
        l.innerHTML = '<div style="padding:10px 14px;font-size:0.82rem;color:var(--fg-3);">결과 없음</div>';
        l.classList.add('show'); return;
    }
    l.innerHTML = items.slice(0, 8).map(s => `
        <div class="ac-item" onclick="pickAc('${s.ticker}','${s.name.replace(/'/g,"\\'")}')">
            <span class="ac-name">${s.name}</span>
            <span class="ac-ticker">${s.ticker}</span>
        </div>`).join('');
    l.classList.add('show'); acIdx = -1;
}
function closeAc() { document.getElementById('acList').classList.remove('show'); acIdx = -1; }
function pickAc(ticker, name) {
    selTicker = ticker;
    document.getElementById('cmpInput').value = name;
    closeAc();
    addStock(ticker, name);
}
function onAcKeydown(e) {
    const items = document.getElementById('acList').querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown')  { e.preventDefault(); acIdx = Math.min(acIdx+1, items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===acIdx)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, -1); items.forEach((el,i)=>el.classList.toggle('active',i===acIdx)); }
    else if (e.key === 'Enter')   { if (acIdx >= 0 && items[acIdx]) items[acIdx].click(); else addByInput(); }
    else if (e.key === 'Escape')  closeAc();
}
document.addEventListener('click', e => { if (!e.target.closest('.ac-wrap')) closeAc(); });

function addByInput() {
    const raw = document.getElementById('cmpInput').value.trim();
    if (!raw) return;
    const ticker = selTicker || raw.toUpperCase();
    const name   = raw;
    addStock(ticker, name);
}

function addStock(ticker, name) {
    if (stocks.length >= 5) { alert('최대 5개까지 추가할 수 있습니다.'); return; }
    if (stocks.find(s => s.ticker === ticker)) { alert('이미 추가된 종목입니다.'); return; }
    stocks.push({ ticker, name });
    document.getElementById('cmpInput').value = '';
    selTicker = null;
    renderChips();
}

function removeStock(ticker) {
    stocks = stocks.filter(s => s.ticker !== ticker);
    renderChips();
}

function renderChips() {
    const row  = document.getElementById('chipsRow');
    const empty = document.getElementById('chipsEmpty');
    if (!stocks.length) {
        row.innerHTML = '<span id="chipsEmpty" style="font-size:0.8rem;color:var(--fg-3);">추가된 종목이 없습니다.</span>';
        document.getElementById('runBtn').disabled = true;
        return;
    }
    row.innerHTML = stocks.map((s, i) => `
        <div class="chip">
            <div class="chip-dot" style="background:${COLORS[i]};"></div>
            <span>${s.name}</span>
            <span style="font-size:0.7rem;color:var(--fg-3);font-family:monospace;">${s.ticker}</span>
            <button class="chip-x" onclick="removeStock('${s.ticker}')"><i class="bi bi-x"></i></button>
        </div>`).join('');
    document.getElementById('runBtn').disabled = stocks.length < 2;
}

// ── 비교 실행 ──
async function runCompare() {
    if (stocks.length < 2) return;
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>불러오는 중...';

    document.getElementById('cmpResult').innerHTML = `
        <div class="skel" style="height:350px;margin-bottom:14px;"></div>
        <div class="skel" style="height:280px;"></div>`;

    try {
        const tickers = stocks.map(s => s.ticker).join(',');
        const res  = await fetch('/stock-compare-data?tickers=' + encodeURIComponent(tickers));
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '데이터 없음');
        renderResult(data.stocks);
    } catch(e) {
        document.getElementById('cmpResult').innerHTML =
            `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>오류: ${e.message}</p></div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-bar-chart-steps me-1"></i>비교 시작';
    }
}

// ── 결과 렌더링 ──
function renderResult(stocksData) {
    const valid = stocksData.filter(s => !s.error);
    if (!valid.length) {
        document.getElementById('cmpResult').innerHTML =
            '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>유효한 데이터가 없습니다.</p></div>';
        return;
    }

    // 통합 날짜 (가장 긴 종목 기준)
    const allDates = [...new Set(valid.flatMap(s => s.dates))].sort();
    const displayDates = allDates.slice(-120).map(d => d.slice(5)); // 최근 6개월, MM-DD

    // 정규화 차트 데이터셋
    const datasets = valid.map((s, i) => {
        const dateMap = {};
        s.dates.forEach((d, j) => { dateMap[d] = s.normalized[j]; });
        return {
            label: s.name,
            data: allDates.slice(-120).map(d => dateMap[d] ?? null),
            borderColor: COLORS[i],
            backgroundColor: COLORS[i] + '18',
            borderWidth: 2, pointRadius: 0, tension: 0.3,
            fill: false, spanGaps: true,
        };
    });

    // 지표 테이블 헤더
    const thCols = valid.map((s, i) => `
        <th>
            <div style="display:flex;align-items:center;gap:6px;justify-content:center;">
                <div style="width:8px;height:8px;border-radius:50%;background:${COLORS[i]};flex-shrink:0;"></div>
                <div>
                    <div class="cmp-stock-head">${s.name}</div>
                    <div class="cmp-stock-code">${s.ticker}</div>
                </div>
            </div>
        </th>`).join('');

    // 지표 행 생성 헬퍼
    const fmtPrice = (v, isKr) => {
        if (v == null) return '<span class="val-gray">-</span>';
        if (isKr) return Math.floor(v).toLocaleString('ko-KR') + '원';
        return '$' + v.toLocaleString('en-US', {minimumFractionDigits:2});
    };
    const fmtChg = v => {
        if (v == null) return '<span class="val-gray">-</span>';
        const cls = v > 0 ? 'val-up' : v < 0 ? 'val-down' : 'val-gray';
        return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
    };
    const fmtEps = (v, isKr) => {
        if (v == null || v === 0) return '<span class="val-gray">-</span>';
        const cls = v > 0 ? 'val-green' : 'val-red';
        const txt = isKr ? Math.floor(v).toLocaleString('ko-KR') + '원'
                         : '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2});
        return `<span class="${cls}">${v < 0 ? '-' : ''}${txt}</span>`;
    };
    const fmtMult = v => v != null ? `<span>${v}배</span>` : '<span class="val-gray">-</span>';
    const fmtMktCap = (v, isKr) => {
        if (!v) return '<span class="val-gray">-</span>';
        if (isKr) {
            const t = v / 1e12;
            return t >= 1 ? t.toFixed(1) + '조' : (v / 1e8).toFixed(0) + '억';
        }
        return v >= 1e12 ? (v/1e12).toFixed(1) + 'T' : v >= 1e9 ? (v/1e9).toFixed(1) + 'B' : (v/1e6).toFixed(0) + 'M';
    };

    const rows = [
        { label: '현재가',   cells: valid.map(s => fmtPrice(s.current_price, s.is_kr)) },
        { label: '당일 등락', cells: valid.map(s => fmtChg(s.change_pct)) },
        { label: 'EPS (주당순이익)', cells: valid.map(s => fmtEps(s.eps, s.is_kr)) },
        { label: 'PER (주가수익비율)', cells: valid.map(s => fmtMult(s.per)) },
        { label: 'PBR (주가순자산)', cells: valid.map(s => fmtMult(s.pbr)) },
        { label: '시가총액',  cells: valid.map(s => fmtMktCap(s.market_cap, s.is_kr)) },
    ].map(r => `
        <tr>
            <td>${r.label}</td>
            ${r.cells.map(c => `<td>${c}</td>`).join('')}
        </tr>`).join('');

    lastStocksData = valid;

    document.getElementById('cmpResult').innerHTML = `
        <div class="chart-card">
            <div class="chart-title"><i class="bi bi-graph-up"></i>정규화 수익률 비교 (기준: 6개월 전 = 100)</div>
            <div class="chart-h"><canvas id="normChart"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="chart-title"><i class="bi bi-table"></i>지표 비교</div>
            <div class="table-responsive">
                <table class="cmp-table">
                    <thead><tr><th>지표</th>${thCols}</tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        </div>
        <div class="ai-card">
            <div class="ai-card-title">
                <i class="bi bi-stars"></i>AI 종목 비교 분석
            </div>
            <button class="ai-run-btn" id="aiRunBtn" onclick="runAiAnalysis()">
                <i class="bi bi-cpu"></i>AI 분석 시작
            </button>
            <div class="ai-output" id="aiOutput"></div>
        </div>`;

    if (chartInst) { chartInst.destroy(); chartInst = null; }
    chartInst = new Chart(document.getElementById('normChart'), {
        type: 'line',
        data: { labels: displayDates, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { boxWidth: 10, font: { size: 11 }, padding: 12 } },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) : '-'}`,
                    }
                }
            },
            scales: {
                x: { grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 10 } } },
                y: {
                    grid: { color: 'rgba(128,128,128,0.1)' },
                    ticks: { font: { size: 10 }, callback: v => v.toFixed(0) },
                }
            }
        }
    });
}
// ── AI 종목 분석 (SSE 스트리밍) ──
async function runAiAnalysis() {
    if (!lastStocksData.length) return;
    const btn = document.getElementById('aiRunBtn');
    const out  = document.getElementById('aiOutput');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 분석 중...';
    out.innerHTML = '<span class="ai-cursor"></span>';
    out.classList.add('visible');

    try {
        const res = await fetch('/stock-compare-ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stocks: lastStocksData }),
        });
        if (!res.ok) throw new Error('요청 실패');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data:')) continue;
                const raw = line.slice(5).trim();
                if (raw === '[DONE]') break;
                try {
                    const obj = JSON.parse(raw);
                    if (obj.error) { out.textContent = '오류: ' + obj.error; break; }
                    if (obj.text) {
                        // remove cursor, append text, re-add cursor
                        const cur = out.querySelector('.ai-cursor');
                        if (cur) cur.remove();
                        out.appendChild(document.createTextNode(obj.text));
                        out.insertAdjacentHTML('beforeend', '<span class="ai-cursor"></span>');
                    }
                } catch {}
            }
        }
    } catch (e) {
        out.textContent = '오류: ' + e.message;
    } finally {
        const cur = out.querySelector('.ai-cursor');
        if (cur) cur.remove();
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cpu"></i>다시 분석';
    }
}
</script>
{% endblock %}
