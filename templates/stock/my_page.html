{% extends "stock/stock_layout.html" %}
{% block title %}내 정보 — GAGYE{% endblock %}
{% block page_name %}내 정보 수정{% endblock %}

{% block content %}
<div style="max-width:520px;margin:0 auto;">

  <!-- 프로필 카드 -->
  <div style="background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--r-3);padding:24px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
      <div style="width:52px;height:52px;background:var(--lime-soft);border:1px solid var(--lime-border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent);font-weight:700;font-family:var(--font-mono);" id="avatarChar">
        {{ session.get('user_name','?')[0] }}
      </div>
      <div>
        <div style="font-weight:700;font-size:1rem;color:var(--fg-1);" id="displayName">{{ session.get('user_name','') }}</div>
        <div style="font-size:0.75rem;color:var(--fg-3);font-family:var(--font-mono);">personal · account</div>
      </div>
    </div>

    <div id="alertBox" style="display:none;padding:10px 14px;border-radius:var(--r-2);font-size:0.82rem;margin-bottom:16px;"></div>

    <form id="profileForm" onsubmit="submitProfile(event)">
      <div style="margin-bottom:14px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">아이디</label>
        <input type="text" id="userId" class="form-control" disabled
          style="background:var(--bg-3)!important;color:var(--fg-3)!important;cursor:not-allowed;">
      </div>

      <div style="margin-bottom:14px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">이름</label>
        <input type="text" id="nameInput" class="form-control" placeholder="이름을 입력하세요" required>
      </div>

      <div style="margin-bottom:20px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">이메일</label>
        <input type="email" id="emailInput" class="form-control" placeholder="이메일 주소">
      </div>

      <hr style="margin-bottom:20px;">
      <p style="font-size:0.78rem;color:var(--fg-3);margin-bottom:14px;">비밀번호 변경 (변경하지 않으려면 비워두세요)</p>

      <div style="margin-bottom:14px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">현재 비밀번호</label>
        <input type="password" id="curPw" class="form-control" placeholder="현재 비밀번호">
      </div>

      <div style="margin-bottom:14px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">새 비밀번호</label>
        <input type="password" id="newPw" class="form-control" placeholder="새 비밀번호 (8자 이상)">
      </div>

      <div style="margin-bottom:20px;">
        <label style="font-size:0.75rem;font-weight:600;color:var(--fg-3);margin-bottom:5px;display:block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;">새 비밀번호 확인</label>
        <input type="password" id="newPwConfirm" class="form-control" placeholder="새 비밀번호를 다시 입력하세요">
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submitBtn">
        변경사항 저장
      </button>
    </form>
  </div>

</div>

<script>
async function loadProfile() {
  try {
    const res  = await fetch('/auth/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const data = await res.json();
    document.getElementById('userId').value    = data.user_id || '';
    document.getElementById('nameInput').value  = data.name  || '';
    document.getElementById('emailInput').value = data.email || '';
  } catch(e) {
    showAlert('프로필 로드 실패: ' + e.message, false);
  }
}

function showAlert(msg, success) {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.style.display = '';
  if (success) {
    box.style.background  = 'rgba(74,222,128,0.12)';
    box.style.border      = '1px solid rgba(74,222,128,0.25)';
    box.style.color       = '#4ade80';
  } else {
    box.style.background  = 'rgba(248,113,113,0.12)';
    box.style.border      = '1px solid rgba(248,113,113,0.25)';
    box.style.color       = '#f87171';
  }
}

async function submitProfile(e) {
  e.preventDefault();
  const name    = document.getElementById('nameInput').value.trim();
  const email   = document.getElementById('emailInput').value.trim();
  const curPw   = document.getElementById('curPw').value;
  const newPw   = document.getElementById('newPw').value;
  const confirm = document.getElementById('newPwConfirm').value;

  if (newPw && newPw !== confirm) {
    showAlert('새 비밀번호가 일치하지 않습니다.', false); return;
  }
  if (newPw && newPw.length < 8) {
    showAlert('새 비밀번호는 8자 이상이어야 합니다.', false); return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '저장 중...';

  try {
    const res = await fetch('/auth/update-profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, current_password: curPw, new_password: newPw }),
    });
    const data = await res.json();
    if (res.ok) {
      showAlert(data.message || '저장되었습니다.', true);
      document.getElementById('displayName').textContent = name;
      document.getElementById('avatarChar').textContent  = name[0] || '?';
      document.getElementById('curPw').value = '';
      document.getElementById('newPw').value = '';
      document.getElementById('newPwConfirm').value = '';
    } else {
      showAlert(data.error || '저장 실패', false);
    }
  } catch(e) {
    showAlert('서버 오류: ' + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = '변경사항 저장';
  }
}

loadProfile();
</script>
{% endblock %}
